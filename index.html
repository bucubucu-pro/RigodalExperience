<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RigóDal Companion — Your Personal Guide to Eger</title>
<meta name="description" content="RigóDal Companion — your personal guide to Eger, hosted by Rigó Rudi.">

<!-- ============================================
     PWA / "ADD TO HOME SCREEN" SETUP
     Together these let a guest install this site as an app icon on
     their phone (no app store needed). Personalized guest info (name,
     check-in/out dates) already survives this automatically — see
     js/guestResolver.js, which caches it in localStorage the first
     time a guest opens their personalized link, independent of
     whether they later open the site via that link, a bookmark, or
     the installed home-screen icon.
     ============================================ -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5C1A2E">
<link rel="icon" href="icons/icon-192.png" type="image/png">

<!-- iOS-specific: Safari doesn't read the manifest for these, so they're
     duplicated here. Without these, "Add to Home Screen" on iPhone would
     still work but use a plain browser-screenshot icon instead of Rudi. -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RigóDal">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/section-hero.css">
<link rel="stylesheet" href="css/section-stay.css">
<link rel="stylesheet" href="css/section-rest.css">
<link rel="stylesheet" href="css/chat-overlay.css">

<!-- Elfsight platform script — loaded once, globally, for any Elfsight
     widget used anywhere on the site (currently: Booking.com Reviews
     in the "proof" module). Do not add a second copy of this script
     inside a module's own HTML — one global copy is enough, and having
     more than one can cause the widget to double-render. -->
<script src="https://elfsightcdn.com/platform.js" async></script>
</head>
<body>

<!-- Scroll progress indicator (shell — always present) -->
<div class="nav-progress" id="navProgress"></div>

<!-- ============================================
     MODULE MOUNT POINT
     All enabled modules (hero, stay, explore, adventure,
     rewards, chat teaser, proof, cta, faq — whatever is
     turned on in js/modules.config.js) get injected here,
     in order, by js/moduleRegistry.js.

     Do NOT hand-edit content here — it's rebuilt on every
     page load from the module files. Edit the module's
     own js/modules/*.js file instead.
     ============================================ -->
<main id="moduleMount"></main>

<!-- ============================================
     PERSISTENT NAV (shell — always present)
     Tab items are generated automatically from
     modules.config.js (any module with inNav: true).
     ============================================ -->
<nav class="tab-bar" id="tabBar">
  <!-- Populated by moduleRegistry.js buildNav() -->
</nav>

<!-- Floating chat button (shell — always present, visibility handled by scrollEngine.js) -->
<button class="rudi-fab" id="rudiFab" data-open-module="chat" aria-label="Ask Rudi">🐦</button>

<!-- ============================================
     BOTTOM SHEET (shell — used by the "stay" module,
     but lives here since only one sheet is ever open
     at a time; harmless if "stay" module is disabled)
     ============================================ -->
<div class="sheet-backdrop" id="sheetBackdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheetContent"></div>
</div>

<!-- ============================================
     OVERLAY MOUNT POINT
     Full-screen overlays (like chat) get injected here
     by their own module's init(), separate from the
     scrolling page flow in #moduleMount.
     ============================================ -->
<div id="overlayMount"></div>

<!-- ============================================
     FOOTER (shell — always present; not a module
     since every guesthouse needs contact info)
     ============================================ -->
<footer class="site-footer">
  <div style="font-family:var(--font-display); font-size:1.25rem; color:white;">RigóDal Vendégház</div>
  <div style="font-size:var(--fs-xs); margin-top:4px;" data-i18n="footer.location">Eger, Hungary</div>

  <div class="footer-contact-row">
    <a href="tel:+36204405400" class="footer-contact-icon">📞</a>
    <a href="https://wa.me/36204405400" class="footer-contact-icon">💬</a>
    <a href="mailto:hello@rigodal.hu" class="footer-contact-icon">✉️</a>
  </div>

  <div class="footer-lang-switch">
    <button data-lang="hu">HU</button>
    <button data-lang="en">EN</button>
    <button data-lang="de">DE</button>
    <button data-lang="pl">PL</button>
    <button data-lang="fr">FR</button>
  </div>

  <div class="footer-legal" data-i18n="footer.legal">Made with ♥ in Eger · © 2026 RigóDal Vendégház</div>
</footer>

<!-- ============================================
     JS LOAD ORDER — this matters:
     1. Data + translations first (modules read from these)
     2. i18n engine (modules call RIGODAL_I18N.t())
     3. Module config + registry engine (the on/off system)
     4. Every individual module file (each self-registers)
     5. scrollEngine + nav (generic behavior, work on any module)
     6. app.js LAST — actually boots everything
     ============================================ -->
<script src="js/data.js"></script>
<script src="js/guestResolver.js"></script>
<script src="js/weatherService.js"></script>
<script src="js/translations.js"></script>
<script src="js/i18n.js"></script>

<script src="js/modules.config.js"></script>
<script src="js/moduleRegistry.js"></script>

<script src="js/modules/hero.js"></script>
<script src="js/modules/stay.js"></script>
<script src="js/modules/explore.js"></script>
<script src="js/modules/adventure.js"></script>
<script src="js/modules/rewards.js"></script>
<script src="js/modules/chat.js"></script>
<script src="js/modules/proof.js"></script>
<script src="js/modules/cta.js"></script>
<script src="js/modules/faq.js"></script>
<!-- Add new module <script> tags here, above app.js -->

<script src="js/scrollEngine.js"></script>
<script src="js/nav.js"></script>
<script src="js/app.js"></script>
</body>
</html>
